name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        shell: pwsh
        run: python -m pip install -e ".[demo]"
      - name: Unit and pipeline smoke tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Reader demo
        shell: pwsh
        run: python demo/run_demo.py --regenerate --ci
      - name: Verify deterministic demo summary
        shell: pwsh
        run: git diff --exit-code -- demo/results/demo_summary.json
      - name: Validate frozen P110 magnetic and strain evidence
        shell: pwsh
        run: python case_studies/p110_magnetic_strain/validate_case.py
      - name: Validate frozen 406 multimodal evidence
        shell: pwsh
        run: python case_studies/406_multimodal/validate_case.py
